<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart Inventory Management System for Restaurants</title>
  <desc id="desc">A green restaurant inventory dashboard with low stock, expiry and delivery indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10281d"/>
      <stop offset="1" stop-color="#174c34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#07160f" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1090" cy="90" r="210" fill="#32d27f" opacity=".12"/>
  <circle cx="110" cy="720" r="260" fill="#8cf0b8" opacity=".08"/>
  <text x="78" y="95" fill="#8cf0b8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">DESIGN METHODS · AUGUST 2026</text>
  <text x="78" y="170" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Smart Inventory</text>
  <text x="78" y="232" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Management System</text>
  <text x="80" y="278" fill="#c7dacf" font-family="Arial, Helvetica, sans-serif" font-size="25">For restaurant managers and staff</text>
  <g transform="translate(475 90)" filter="url(#shadow)">
    <rect width="650" height="560" rx="28" fill="#f7faf8"/>
    <rect width="650" height="76" rx="28" fill="#ffffff"/>
    <circle cx="38" cy="38" r="8" fill="#ff6b63"/>
    <circle cx="64" cy="38" r="8" fill="#f2c94c"/>
    <circle cx="90" cy="38" r="8" fill="#2ecc71"/>
    <text x="126" y="46" fill="#173226" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Inventory overview</text>
    <g transform="translate(30 105)">
      <rect width="180" height="112" rx="18" fill="#e5f7ed"/>
      <text x="18" y="34" fill="#4c6f5c" font-family="Arial, Helvetica, sans-serif" font-size="16">Items in stock</text>
      <text x="18" y="82" fill="#173226" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">284</text>
      <rect x="205" width="180" height="112" rx="18" fill="#fff2db"/>
      <text x="223" y="34" fill="#806738" font-family="Arial, Helvetica, sans-serif" font-size="16">Low stock</text>
      <text x="223" y="82" fill="#5a451f" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">12</text>
      <rect x="410" width="180" height="112" rx="18" fill="#ffe7e4"/>
      <text x="428" y="34" fill="#8b514b" font-family="Arial, Helvetica, sans-serif" font-size="16">Expiring soon</text>
      <text x="428" y="82" fill="#6d302b" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">08</text>
      <rect y="140" width="590" height="275" rx="18" fill="#ffffff" stroke="#dce7e0"/>
      <text x="22" y="178" fill="#173226" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Products requiring attention</text>
      <g font-family="Arial, Helvetica, sans-serif" font-size="16">
        <text x="22" y="224" fill="#51675b">Tomatoes</text><text x="245" y="224" fill="#9b6b13">Low stock</text><text x="455" y="224" fill="#51675b">Reorder</text>
        <line x1="22" y1="244" x2="568" y2="244" stroke="#e7ece9"/>
        <text x="22" y="283" fill="#51675b">Fresh cream</text><text x="245" y="283" fill="#b8493f">Expires tomorrow</text><text x="455" y="283" fill="#51675b">Review</text>
        <line x1="22" y1="303" x2="568" y2="303" stroke="#e7ece9"/>
        <text x="22" y="342" fill="#51675b">Cooking oil</text><text x="245" y="342" fill="#9b6b13">Low stock</text><text x="455" y="342" fill="#51675b">Reorder</text>
      </g>
      <rect x="22" y="365" width="158" height="38" rx="19" fill="#22bf63"/>
      <text x="48" y="390" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">View inventory</text>
    </g>
  </g>
  <text x="80" y="660" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Research · Ideation · Prototype · User testing</text>
  <text x="80" y="704" fill="#9fc5ae" font-family="Arial, Helvetica, sans-serif" font-size="18">Academic team project</text>
</svg>